name: CICD

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v3
        
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: 'eu-north-1'
          
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1  
        with:
          mask-password: 'true'
          
      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          REPOSITORY: inova-product_service
        run: |
          docker build -t $ECR_REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
          
      - name: List files in workspace
        run: ls -la
        # This helps debug where your file is
          
      - name: Clean task definition (remove metadata fields)
        run: |
          # Check if file exists in current directory
          if [ -f "inova-productservice-class-definition.json" ]; then
            echo "✅ Found file in current directory"
            cat inova-productservice-class-definition.json | jq 'del(.taskDefinitionArn, .revision, .status, .registeredAt, .registeredBy, .requiresAttributes, .compatibilities, .tags, .enableFaultInjection)' > cleaned-task-def.json
            mv cleaned-task-def.json inova-productservice-class-definition.json
            echo "✅ Cleaned task definition"
          else
            echo "❌ File not found! Looking in all directories..."
            find . -name "*.json" -type f
            exit 1
          fi
          
      # ⚠️ Use v1 for render (v2 doesn't exist!)
      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: inova-productservice-class-definition.json
          container-name: inova-product_service
          image: ${{ steps.build-image.outputs.image }}
          
      # ✅ Use v2 for deploy (fixes enableFaultInjection error)
      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: inova-product_service
          cluster: DevCluster
          wait-for-service-stability: true